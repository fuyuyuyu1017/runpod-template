<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メインページ</title>
<style>
:root {
  --bg: #f2f4f3; --surface: #ffffff; --ink: #16201c; --muted: #5a6863; --line: #d3dbd8;
  --accent: #0d7466; --accent-ink: #ffffff; --accent-soft: #d6eee8; --star: #a8650f; --warn: #b42318;
  --mono: ui-monospace, "SFMono-Regular", Menlo, monospace; --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1412; --surface: #161e1b; --ink: #e2eae7; --muted: #92a19b; --line: #2a3531;
    --accent: #3cc2ae; --accent-ink: #06201b; --accent-soft: #173a33; --star: #e3a940; --warn: #f97066; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
header h1 { font-size: 1rem; margin: 0; }
header a { color: var(--accent); font-size: .9rem; }
.btn.danger { border-color: var(--warn); color: var(--warn); font-size: .85rem; padding: 2px 10px; }
nav { display: flex; gap: 4px; margin-left: auto; }
nav button { border: 0; background: none; padding: 6px 12px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
main { max-width: 1100px; margin: 0 auto; padding: 16px 16px 80px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: .85rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 5px 12px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.runs label { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); }
.runs .lab { font-size: .8rem; color: var(--muted); margin-top: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: var(--surface); font-size: .85rem; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.item { border-top: 1px solid var(--line); padding: 10px 0; }
.item h3 { font-size: .95rem; margin: 0 0 2px; }
.clip { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 3px 0; }
.clip audio { width: 100%; height: 36px; }
.clip img, .grid img { max-width: 100%; max-height: 260px; border-radius: 4px; display: block; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.star { border: 0; background: none; font-size: 1.2rem; color: var(--muted); }
.star[aria-pressed="true"] { color: var(--star); }
.scores { display: grid; gap: 6px; margin: 8px 0; }
.scores .row button { min-width: 2.2rem; }
.scores button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
textarea, input[type=text], select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; overflow: auto; max-height: 60vh; font: .8rem/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
td.num { text-align: right; font-family: var(--mono); }
.err { color: var(--warn); }
.gridwrap { overflow-x: auto; }
.matrix th, .matrix td { vertical-align: top; border-bottom: 1px solid var(--line); padding: 6px; }
.matrix td { min-width: 180px; }
.matrix img { max-width: 240px; max-height: 240px; display: block; border-radius: 4px; cursor: zoom-in; }
.matrix audio { width: 220px; height: 36px; }
.grid img, .clip img { cursor: zoom-in; }
#pickbar[hidden] { display: none; }
#pickbar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--accent); border-radius: var(--radius); padding: 8px 12px; box-shadow: 0 4px 16px rgb(0 0 0 / .2); z-index: 5; }
#overlay { position: fixed; inset: 0; background: var(--bg); z-index: 10; display: flex; flex-direction: column; overflow: auto; }
.ovbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; }
.ovbody { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 16px; flex: 1; }
.ovbody img { max-width: 100%; max-height: calc(100vh - 90px); object-fit: contain; margin: 0 auto; display: block; }
#overlay dl { margin: 0; font-size: .85rem; } #overlay dt { font-weight: 600; color: var(--ink); margin-top: 8px; } #overlay dd { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
#cmpview { padding: 16px; }
.side { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .side figure { margin: 0; } .side img { width: 100%; max-height: 75vh; object-fit: contain; } .side figcaption { text-align: center; color: var(--muted); }
.wipe { position: relative; max-width: 100%; width: fit-content; margin: 0 auto; } .wipe img { display: block; max-width: 100%; max-height: 75vh; }
.wipetop { position: absolute; inset: 0; } .wipetop img { width: 100%; height: 100%; object-fit: contain; }
#wipe { width: 100%; max-width: 600px; display: block; margin: 8px auto 0; }
.cmpmeta { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 16px 16px; font-size: .9rem; }
@media (max-width: 800px) { .ovbody, .cmpmeta, .side { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .clip { grid-template-columns: minmax(0, 1fr) auto; } .clip .name { grid-column: 1 / -1; } nav { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <h1>メインページ</h1>
  <span id="links"></span>
  <button class="btn danger" id="delpod" hidden>Podを削除</button>
  <nav>
    <button data-tab="results" aria-selected="true">結果</button>
    <button data-tab="checks" aria-selected="false">確認</button>
    <button data-tab="tasks" aria-selected="false">作業</button>
  </nav>
</header>
<main id="main"></main>
<script>
const POD = /*POD*/null;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = t => t ? new Date(t * 1000).toLocaleString("ja-JP", {month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"}) : "";
const fmtBytes = b => b == null ? "?" : b > 1e9 ? (b / 1e9).toFixed(1) + " GB" : b > 1e6 ? (b / 1e6).toFixed(0) + " MB" : (b / 1e3).toFixed(0) + " KB";
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (r.status === 401) { location.href = "/login"; throw new Error("login"); }
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
let timer = null;
function setTimer(fn, ms) { clearInterval(timer); timer = fn ? setInterval(fn, ms) : null; }

if (POD && POD.id) $("#links").innerHTML = [[POD.files, "ファイルブラウザ"], [POD.jupyter, "JupyterLab"], [POD.app3000, "3000番のアプリ"]]
  .filter(([u]) => u).map(([u, l]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${l}</a>`).join(" · ");
if (POD && POD.deletable) {
  $("#delpod").hidden = false;
  $("#delpod").onclick = async () => {
    const {jobs} = await api("/api/tasks");
    const running = jobs.filter(j => j.exit == null).length;
    if (!confirm((running ? `実行中の作業が${running}件あります。止まりますが、` : "") + "このPodを削除しますか？\nNetwork Volume のファイルは残ります。")) return;
    try {
      await api("/api/pod/delete", {confirm: POD.id});
      setTimer(null);
      document.body.innerHTML = `<main><div class="card"><strong>Podの削除を頼みました</strong><p class="muted">1分ほどで止まり、課金も止まります。このページは閉じてください。</p></div></main>`;
    } catch (err) { alert(err.message); }
  };
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.tab));
function show(tab) {
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  setTimer(null);
  ({results: showRuns, checks: showChecks, tasks: showTasks})[tab]();
}

// ---------------- 結果 ----------------
let view = null, ratings = {};
async function showRuns() {
  const runs = await api("/api/runs");
  let h = `<div class="card"><div class="row"><strong>生成した結果</strong><span class="muted">比べたいものにチェックして「開く」（複数選べます）</span>
    <button class="btn primary" id="open" disabled>開く</button></div><div class="runs">`;
  let lab = null;
  for (const r of runs) {
    if (r.lab !== lab) { lab = r.lab; h += `<div class="lab">${esc(lab)}</div>`; }
    h += `<label><input type="checkbox" value="${esc(r.lab + "/" + r.run)}"><span>${r.title && !r.title.endsWith(r.run) ? `${esc(r.title)} <span class="muted mono">${esc(r.run)}</span>` : esc(r.title || r.run)}${r.note ? `<br><span class="muted" style="font-size:.85rem">${esc(r.note)}</span>` : ""}</span><span class="muted mono">${fmtTime(r.mtime)}</span></label>`;
  }
  if (!runs.length) h += `<p class="muted">まだありません（/workspace/*-lab/generated/ と、/workspace/hub/sources.json で足した場所を探します）</p>`;
  $("#main").innerHTML = h + `</div></div>`;
  const boxes = [...document.querySelectorAll(".runs input")];
  boxes.forEach(b => b.onchange = () => $("#open").disabled = !boxes.some(x => x.checked));
  $("#open").onclick = () => openRuns(boxes.filter(x => x.checked).map(x => x.value));
}
async function openRuns(keys) {
  const [details, rt] = await Promise.all([Promise.all(keys.map(k => { const i = k.indexOf("/"); return api(`/api/run?lab=${encodeURIComponent(k.slice(0, i))}&run=${encodeURIComponent(k.slice(i + 1))}`); })), api("/api/ratings")]);
  ratings = rt;
  const conds = [], sentences = {};
  for (const d of details) {
    Object.assign(sentences, d.sentences);
    for (const c of d.conditions)
      conds.push({key: `${d.lab}/${d.run}/${c.name}`, label: keys.length > 1 ? `${d.title || d.run} / ${c.label}` : c.label, note: c.note, lab: d.lab, run: d.run, files: c.files, scores: d.scores, texts: d.texts});
  }
  const titles = details.map(d => !d.title || d.title.endsWith(d.run) ? d.title || d.run : `${d.title}（${d.run}）`), notes = details.map(d => d.note).filter(Boolean);
  const images = conds.some(c => c.files.some(f => f.kind === "image"));
  view = {keys, titles, notes, conds, sentences, mode: images && conds.length === 1 ? "cond" : "file", on: new Set(conds.map(c => c.key)), cond: conds[0]?.key,
    sort: "name", starOnly: false, limit: PAGE};
  renderView();
}
const PAGE = 60;
const byName = (a, b) => a.localeCompare(b, undefined, {numeric: true});
const srcOf = (c, f) => `/media/${encodeURIComponent(c.lab)}/${encodeURIComponent(c.run)}/${f.path.split("/").map(encodeURIComponent).join("/")}`;
const starKey = (c, f) => `${c.key}/${f.name}`;
let picks = [];  // 比べる2枚 [{c, f}]
function media(c, f) {
  const src = srcOf(c, f);
  return f.kind === "audio" ? `<audio controls preload="none" src="${src}"></audio>` : `<img loading="lazy" src="${src}" alt="${esc(f.name)}" data-zoom="${esc(starKey(c, f))}">`;
}
const starBtn = (c, f) => `<button class="star" data-star="${esc(starKey(c, f))}" aria-pressed="${!!ratings[starKey(c, f)]?.star}" title="良い">★</button>`;
const pickBtn = (c, f) => f.kind === "image" ? `<button class="chip" data-pick="${esc(starKey(c, f))}" aria-pressed="${picks.some(p => starKey(p.c, p.f) === starKey(c, f))}" title="2枚を選んで比べる">比</button>` : "";
function sentenceOf(name) {
  const m = name.replace(/\.[^.]+$/, "").match(/^(\d+)_(.*)$/);
  if (!m) return view.sentences[name.replace(/\.[^.]+$/, "")];
  return view.sentences["#" + parseInt(m[1], 10)] || view.sentences[m[2]];
}
function findFile(key) {
  for (const c of view.conds) for (const f of c.files) if (starKey(c, f) === key) return {c, f};
}
function sortedFiles(c) {
  let files = [...c.files];
  if (view.starOnly) files = files.filter(f => ratings[starKey(c, f)]?.star);
  if (view.sort === "new") files.sort((a, b) => b.mtime - a.mtime);
  else if (view.sort === "old") files.sort((a, b) => a.mtime - b.mtime);
  else files.sort((a, b) => byName(a.name, b.name));
  if (view.sort === "star") files.sort((a, b) => !!ratings[starKey(c, b)]?.star - !!ratings[starKey(c, a)]?.star);
  return files;
}
function renderView() {
  const v = view, shown = v.conds.filter(c => v.on.has(c.key));
  let h = `<div class="card"><div class="row"><button class="btn" id="back">← 一覧へ</button><strong>${esc(v.titles.join("、"))}</strong></div>${v.notes.length ? `<p class="muted" style="margin:4px 0 0">${esc(v.notes.join(" / "))}</p>` : ""}
    <div class="row" style="margin-top:8px">${[["file", "ファイルごとに比べる"], ["grid", "格子で並べる"], ["cond", "条件ごとに見る・評価する"]].map(([m, l]) =>
      `<button class="chip" data-mode="${m}" aria-pressed="${v.mode === m}">${l}</button>`).join("")}</div>`;
  if (v.mode !== "cond") {
    h += `<div class="chips">${v.conds.map(c => `<button class="chip" data-cond="${esc(c.key)}" aria-pressed="${v.on.has(c.key)}" title="${esc(c.note)}">${esc(c.label)}</button>`).join("")}</div></div>`;
    const names = [...new Set(shown.flatMap(c => c.files.map(f => f.name)))].sort(byName);
    const page = names.slice(0, v.limit);
    if (v.mode === "file") {
      h += `<div class="card">`;
      for (const name of page) {
        const s = sentenceOf(name);
        h += `<div class="item"><h3 class="mono">${esc(name)}</h3>${s ? `<div>${esc(s.text)}</div><div class="muted" style="font-size:.85rem">${esc(s.caption)}</div>` : ""}`;
        for (const c of shown) {
          const f = c.files.find(f => f.name === name);
          if (f) h += `<div class="clip"><span class="name muted">${esc(c.label)}</span>${media(c, f)}<span class="row">${pickBtn(c, f)}${starBtn(c, f)}</span></div>`;
        }
        h += `</div>`;
      }
    } else {
      // 格子：行＝ファイル、列＝条件
      h += `<div class="card gridwrap"><table class="matrix"><tr><th></th>${shown.map(c => `<th title="${esc(c.note)}">${esc(c.label)}</th>`).join("")}</tr>`;
      for (const name of page) {
        const s = sentenceOf(name);
        h += `<tr><th class="mono" title="${esc(s?.text)}">${esc(name)}</th>${shown.map(c => { const f = c.files.find(f => f.name === name);
          return `<td>${f ? `${media(c, f)}<span class="row">${pickBtn(c, f)}${starBtn(c, f)}</span>` : ""}</td>`; }).join("")}</tr>`;
      }
      h += `</table>`;
    }
    h += names.length ? "" : `<p class="muted">音声・画像がありません</p>`;
    h += names.length > v.limit ? `<button class="btn" id="more">続きを表示（残り ${names.length - v.limit}）</button>` : "";
    h += `</div>`;
  } else {
    const c = v.conds.find(c => c.key === v.cond) || v.conds[0];
    const r = ratings[c.key] || {};
    const files = sortedFiles(c), page = files.slice(0, v.limit);
    h += `<select id="cond" style="margin-top:8px">${v.conds.map(x => `<option value="${esc(x.key)}" ${x.key === c.key ? "selected" : ""}>${esc(x.label)}（${x.files.length}）</option>`).join("")}</select>${c.note ? `<p class="muted" style="margin:4px 0 0">${esc(c.note)}</p>` : ""}</div>
      <div class="card"><div class="scores">${c.scores.map(({key, label}) =>
        `<div class="row"><span style="min-width:6rem">${esc(label)}</span>${[1, 2, 3, 4, 5].map(n => `<button class="btn" data-score="${esc(key)}" data-n="${n}" aria-pressed="${r[key] === n}">${n}</button>`).join("")}</div>`).join("")}</div>
      ${c.texts.map(({key, label}) => `<label>${esc(label)}<input type="text" data-text="${esc(key)}" value="${esc(r[key])}"></label>`).join("")}
      <label>メモ<textarea id="memo" rows="3">${esc(r.memo)}</textarea></label>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="save">保存</button><span id="saved" class="muted">${r.updated ? "保存済み " + fmtTime(r.updated) : ""}</span></div></div>
      <div class="card"><div class="row" style="margin-bottom:8px"><label class="row">並べ方<select id="sort" style="width:auto">${[["name", "名前順"], ["new", "新しい順"], ["old", "古い順"], ["star", "☆を先に"]].map(([k, l]) =>
        `<option value="${k}" ${v.sort === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
        <label class="row"><input type="checkbox" id="staronly" ${v.starOnly ? "checked" : ""}>☆だけ</label><span class="muted">${files.length}件</span></div>
      ${files.some(f => f.kind === "image") ? `<div class="grid">${page.map(f => `<div>${media(c, f)}<div class="row"><span class="mono muted" style="flex:1;overflow-wrap:anywhere">${esc(f.name)}</span>${pickBtn(c, f)}${starBtn(c, f)}</div></div>`).join("")}</div>` :
        page.map(f => { const s = sentenceOf(f.name); return `<div class="item"><div class="row"><span class="mono" style="flex:1">${esc(f.name)}</span>${starBtn(c, f)}</div>${s ? `<div>${esc(s.text)}</div>` : ""}${media(c, f)}</div>`; }).join("")}
      ${files.length > v.limit ? `<button class="btn" id="more" style="margin-top:8px">続きを表示（残り ${files.length - v.limit}）</button>` : ""}</div>`;
  }
  $("#main").innerHTML = h + pickBar();
  $("#back").onclick = () => { picks = []; showRuns(); };
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { v.mode = b.dataset.mode; v.limit = PAGE; renderView(); });
  document.querySelectorAll("[data-cond]").forEach(b => b.onclick = () => { v.on.has(b.dataset.cond) ? v.on.delete(b.dataset.cond) : v.on.add(b.dataset.cond); renderView(); });
  if ($("#more")) $("#more").onclick = () => { v.limit += PAGE; renderView(); };
  bindItems($("#main"));
  if (v.mode === "cond") {
    const c = v.conds.find(c => c.key === v.cond) || v.conds[0];
    const draft = {...(ratings[c.key] || {})};
    $("#cond").onchange = e => { v.cond = e.target.value; v.limit = PAGE; renderView(); };
    $("#sort").onchange = e => { v.sort = e.target.value; renderView(); };
    $("#staronly").onchange = e => { v.starOnly = e.target.checked; renderView(); };
    document.querySelectorAll("[data-score]").forEach(b => b.onclick = () => {
      draft[b.dataset.score] = +b.dataset.n;
      document.querySelectorAll(`[data-score="${CSS.escape(b.dataset.score)}"]`).forEach(x => x.setAttribute("aria-pressed", x === b));
    });
    $("#save").onclick = async () => {
      const value = {memo: $("#memo").value};
      c.scores.forEach(({key}) => { if (draft[key] != null) value[key] = draft[key]; });
      document.querySelectorAll("[data-text]").forEach(i => value[i.dataset.text] = i.value);
      await api("/api/ratings", {key: c.key, value});
      ratings[c.key] = {...value, updated: Date.now() / 1000};
      $("#saved").textContent = "保存しました";
    };
  }
}
// ☆・比べる・拡大のボタン（一覧・拡大表示・比較で共通）
function bindItems(root) {
  root.querySelectorAll("[data-star]").forEach(b => b.onclick = async () => {
    const k = b.dataset.star, on = b.getAttribute("aria-pressed") !== "true";
    await api("/api/ratings", {key: k, value: on ? {star: true} : null});
    on ? ratings[k] = {star: true} : delete ratings[k];
    document.querySelectorAll(`[data-star="${CSS.escape(k)}"]`).forEach(x => x.setAttribute("aria-pressed", on));
  });
  root.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    const k = b.dataset.pick, i = picks.findIndex(p => starKey(p.c, p.f) === k);
    if (i >= 0) picks.splice(i, 1); else { picks.push(findFile(k)); if (picks.length > 2) picks.shift(); }
    document.querySelectorAll("[data-pick]").forEach(x => x.setAttribute("aria-pressed", picks.some(p => starKey(p.c, p.f) === x.dataset.pick)));
    const bar = $("#pickbar"); if (bar) bar.outerHTML = pickBar(); else document.body.insertAdjacentHTML("beforeend", pickBar());
    bindPickBar();
  });
  root.querySelectorAll("[data-zoom]").forEach(img => img.onclick = () => openZoom(img.dataset.zoom));
  bindPickBar();
}
function pickBar() {
  return picks.length ? `<div id="pickbar"><span>比べる画像 ${picks.length}/2</span><button class="btn primary" id="cmp" ${picks.length < 2 ? "disabled" : ""}>2枚を比べる</button><button class="btn" id="pickclear">選び直す</button></div>` : `<div id="pickbar" hidden></div>`;
}
function bindPickBar() {
  if ($("#cmp")) $("#cmp").onclick = openCompare;
  if ($("#pickclear")) $("#pickclear").onclick = () => { picks = []; renderView(); };
}

// ---------------- 拡大・比較（全画面の重ね表示） ----------------
function overlay(html) {
  closeOverlay();
  document.body.insertAdjacentHTML("beforeend", `<div id="overlay" role="dialog" aria-modal="true">${html}</div>`);
  document.body.style.overflow = "hidden";
  $("#ovclose").onclick = closeOverlay;
  return $("#overlay");
}
function closeOverlay() { $("#overlay")?.remove(); document.body.style.overflow = ""; document.onkeydown = null; }
const metaUrl = (c, f) => `/api/meta?lab=${encodeURIComponent(c.lab)}&run=${encodeURIComponent(c.run)}&path=${encodeURIComponent(f.path)}`;
function metaHtml(m) {
  const rows = Object.entries(m.summary).map(([k, vs]) => `<dt>${esc(k)}</dt>${vs.map(x => `<dd>${esc(x)}</dd>`).join("")}`).join("");
  const raw = Object.keys(m.raw).length ? `<details><summary>埋め込まれた情報をすべて見る</summary><pre>${esc(Object.entries(m.raw).map(([k, x]) => `## ${k}\n${x}`).join("\n\n"))}</pre></details>` : "";
  return (rows ? `<dl>${rows}</dl>` : `<p class="muted">生成情報は埋め込まれていません</p>`) + raw + `<p class="muted mono">${fmtBytes(m.size)} · ${fmtTime(m.mtime)}</p>`;
}
async function loadMeta(el, c, f) {
  try { el.innerHTML = metaHtml(await api(metaUrl(c, f))); } catch (e) { el.textContent = e.message; }
}
function openZoom(key) {
  const {c, f} = findFile(key);
  const list = v => (v.mode === "cond" ? sortedFiles(c) : c.files).filter(x => x.kind === "image");
  const files = list(view), i = files.findIndex(x => x.name === f.name);
  const go = d => { const n = files[(i + d + files.length) % files.length]; if (n) openZoom(starKey(c, n)); };
  const ov = overlay(`<div class="ovbar"><strong>${esc(c.label)}</strong><span class="mono">${esc(f.name)}</span><span class="muted">${i + 1}/${files.length}</span>
      <span class="row" style="margin-left:auto">${pickBtn(c, f)}${starBtn(c, f)}<button class="btn" id="ovprev">←</button><button class="btn" id="ovnext">→</button><button class="btn" id="ovclose">閉じる</button></span></div>
    <div class="ovbody"><img src="${srcOf(c, f)}" alt="${esc(f.name)}"><aside id="ovmeta" class="muted">読み込み中…</aside></div>`);
  $("#ovprev").onclick = () => go(-1); $("#ovnext").onclick = () => go(1);
  document.onkeydown = e => { if (e.key === "Escape") closeOverlay(); if (e.key === "ArrowLeft") go(-1); if (e.key === "ArrowRight") go(1); };
  bindItems(ov);
  loadMeta($("#ovmeta"), c, f);
}
function openCompare() {
  const [a, b] = picks;
  const ov = overlay(`<div class="ovbar"><strong>2枚を比べる</strong><span class="row"><button class="chip" data-cmp="side" aria-pressed="true">並べる</button><button class="chip" data-cmp="wipe" aria-pressed="false">重ねる</button></span>
      <button class="btn" id="ovclose" style="margin-left:auto">閉じる</button></div>
    <div id="cmpview"></div>
    <div class="cmpmeta">${[a, b].map((p, i) => `<div><strong>${"AB"[i]}：${esc(p.c.label)}</strong> <span class="mono">${esc(p.f.name)}</span><div id="cm${i}" class="muted">読み込み中…</div></div>`).join("")}</div>`);
  const draw = mode => {
    ov.querySelectorAll("[data-cmp]").forEach(x => x.setAttribute("aria-pressed", x.dataset.cmp === mode));
    $("#cmpview").innerHTML = mode === "side"
      ? `<div class="side">${[a, b].map((p, i) => `<figure><img src="${srcOf(p.c, p.f)}" alt=""><figcaption>${"AB"[i]}</figcaption></figure>`).join("")}</div>`
      : `<div class="wipe"><img src="${srcOf(b.c, b.f)}" alt=""><div class="wipetop"><img src="${srcOf(a.c, a.f)}" alt=""></div></div>
         <input type="range" id="wipe" min="0" max="100" value="50" aria-label="AとBの境目"><p class="muted">左がA、右がB。つまみで境目を動かします</p>`;
    if (mode === "wipe") {
      const set = () => $(".wipetop").style.clipPath = `inset(0 ${100 - $("#wipe").value}% 0 0)`;
      $("#wipe").oninput = set; set();
    }
  };
  ov.querySelectorAll("[data-cmp]").forEach(x => x.onclick = () => draw(x.dataset.cmp));
  document.onkeydown = e => { if (e.key === "Escape") closeOverlay(); };
  draw("side");
  loadMeta($("#cm0"), a.c, a.f); loadMeta($("#cm1"), b.c, b.f);
}

// ---------------- 確認 ----------------
async function showChecks() {
  const [logs, disk] = await Promise.all([api("/api/logs"), api("/api/disk")]);
  $("#main").innerHTML = `<div class="card"><div class="row"><strong>ログ</strong><select id="log" style="width:auto;flex:1">${logs.map(l =>
      `<option value="${esc(l.path)}">${esc(l.path)}（${fmtTime(l.mtime)}）</option>`).join("")}</select>
      <label class="row"><input type="checkbox" id="follow" checked>自動で更新</label></div><pre id="logtext" class="muted">ログを選んでください</pre></div>
    <div class="card"><div class="row"><strong>容量</strong><button class="btn" id="du">調べる</button><span id="dustate" class="muted"></span></div><div id="disk"></div></div>`;
  const load = async () => { if (!$("#log")?.value) return; const r = await api(`/api/log?path=${encodeURIComponent($("#log").value)}`); const pre = $("#logtext"); pre.textContent = r.lines.join("\n"); pre.classList.remove("muted"); pre.scrollTop = pre.scrollHeight; };
  $("#log").onchange = load;
  $("#follow").onchange = e => setTimer(e.target.checked ? load : null, 5000);
  load(); setTimer(load, 5000);
  const renderDisk = d => {
    $("#dustate").textContent = d.running ? "調べています（数分かかります）" : d.at ? "調べた時刻 " + fmtTime(d.at) : "";
    if (!d.rows.length) return;
    const rows = [...d.rows].sort((a, b) => (b.bytes || 0) - (a.bytes || 0));
    $("#disk").innerHTML = (d.volume ? `<p class="muted">Network Volume：使用 ${fmtBytes(d.volume.used)} / 全体 ${fmtBytes(d.volume.total)}</p>` : "") +
      `<table><tr><th>フォルダ</th><th>サイズ</th></tr>${rows.map(r => `<tr><td class="mono">${esc(r.path)}</td><td class="num">${fmtBytes(r.bytes)}</td></tr>`).join("")}</table>`;
  };
  renderDisk(disk);
  $("#du").onclick = async () => {
    await api("/api/disk", {});
    const poll = setInterval(async () => { const d = await api("/api/disk"); renderDisk(d); if (!d.running) clearInterval(poll); }, 3000);
  };
}

// ---------------- 作業 ----------------
async function showTasks(openJob) {
  const {tasks, jobs} = await api("/api/tasks");
  $("#main").innerHTML = tasks.map(t => `<form class="card" data-task="${esc(t.id)}"><strong>${esc(t.title)}</strong><p class="muted" style="margin:4px 0 8px">${esc(t.desc)}</p>
      ${t.params.map(p => `<label>${esc(p.label)}${p.kind === "textarea" ? `<textarea name="${esc(p.name)}" rows="4"></textarea>` : `<input type="text" name="${esc(p.name)}">`}</label>`).join("")}
      <div class="row" style="margin-top:8px"><button class="btn primary">実行</button><span class="err"></span></div></form>`).join("") +
    (tasks.length ? "" : `<p class="muted card">作業がありません（/workspace/hub/tasks/*.sh を読みます）</p>`) +
    `<div class="card"><strong>実行した作業</strong><table>${jobs.map(j => `<tr><td><a href="#" data-job="${esc(j.id)}">${esc(j.title)}</a></td><td class="mono">${fmtTime(j.started)}</td><td>${j.exit == null ? "実行中" : j.exit === "0" ? "完了" : "失敗（" + esc(j.exit) + "）"}</td></tr>`).join("")}</table>
    <pre id="jobout" hidden></pre></div>`;
  document.querySelectorAll("form[data-task]").forEach(f => f.onsubmit = async e => {
    e.preventDefault();
    const params = Object.fromEntries(new FormData(f));
    try { const r = await api("/api/tasks/run", {task: f.dataset.task, params}); showTasks(r.job); }
    catch (err) { $(".err", f).textContent = err.message; }
  });
  const follow = async id => {
    const r = await api(`/api/job?id=${encodeURIComponent(id)}`);
    const pre = $("#jobout"); if (!pre) return;
    pre.hidden = false; pre.textContent = r.lines.join("\n") + (r.exit == null ? "\n（実行中）" : `\n（終了コード ${r.exit}）`); pre.scrollTop = pre.scrollHeight;
    if (r.exit != null) setTimer(null);
  };
  document.querySelectorAll("[data-job]").forEach(a => a.onclick = e => { e.preventDefault(); follow(a.dataset.job); setTimer(() => follow(a.dataset.job), 3000); });
  if (openJob) { follow(openJob); setTimer(() => follow(openJob), 3000); }
}

show("results");
</script>
