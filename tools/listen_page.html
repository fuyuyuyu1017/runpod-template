<title>音声試聴ルーム</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 実験を選ぶ帯 → 2つの作業（文ごとに聞き比べ／条件ごとに評価）。行＝文、列＝条件の試聴卓 */
:root {
  --bg: #f2f4f3;
  --surface: #ffffff;
  --ink: #16201c;
  --muted: #5a6863;
  --line: #d3dbd8;
  --accent: #0d7466;
  --accent-ink: #ffffff;
  --accent-soft: #d6eee8;
  --star: #a8650f;
  --warn: #b42318;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --surface: #161e1b; --ink: #e2eae7; --muted: #92a19b; --line: #2a3531;
    --accent: #3cc2ae; --accent-ink: #06201b; --accent-soft: #173a33; --star: #e3a940; --warn: #f97066;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #161e1b; --ink: #e2eae7; --muted: #92a19b; --line: #2a3531;
  --accent: #3cc2ae; --accent-ink: #06201b; --accent-soft: #173a33; --star: #e3a940; --warn: #f97066;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.3; }
h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: .01em; }
h2 { font-size: 1.05rem; font-weight: 700; }
button, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-family: var(--font-mono); }

header.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; justify-content: space-between; }
header.top .ident { display: grid; gap: 2px; min-width: 0; }
.exp-pick { display: grid; gap: 4px; min-width: 0; }
.exp-pick select { max-width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.desc { max-width: 70ch; margin: 0; color: var(--muted); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 8px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* 条件の凡例 */
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: .85rem; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip[aria-pressed="false"] .letter { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.letter { display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; flex: none; border-radius: 999px; background: var(--ink); color: var(--bg); font-family: var(--font-mono); font-size: .75rem; font-weight: 600; }
.legend-note { font-size: .8rem; color: var(--muted); }

/* 文ごとに聞き比べ */
.rows { display: grid; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: minmax(0, 20rem) minmax(0, 1fr); gap: 12px 20px; padding-block: 14px; border-bottom: 1px solid var(--line); }
.sent { display: grid; gap: 2px; align-content: start; min-width: 0; }
.sent .key { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.sent .key .mono { font-size: .8rem; color: var(--muted); }
.sent .text { font-size: 1rem; }
.sent .cap { font-size: .82rem; color: var(--muted); }
.row-act { justify-self: start; margin-top: 6px; border: 1px solid var(--line); background: none; border-radius: var(--radius); padding: 2px 10px; font-size: .8rem; color: var(--muted); }
.row-act:hover { color: var(--ink); border-color: var(--muted); }
.clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: 6px; align-content: start; min-width: 0; }
.clip { display: flex; min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.clip.picked { border-color: var(--star); }
.play { --p: 0%; flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 0; text-align: left;
  background: linear-gradient(90deg, var(--accent-soft) var(--p), transparent var(--p)); }
.play .name { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: .8rem; line-height: 1.35; }
.play .dur { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.play.playing .letter { background: var(--accent); color: var(--accent-ink); }
.play.bad .dur { color: var(--warn); }
.pick { flex: none; width: 2rem; border: 0; border-left: 1px solid var(--line); background: none; color: var(--muted); font-size: 1rem; line-height: 1; }
.pick[aria-pressed="true"] { color: var(--star); }
.clip.missing { opacity: .4; }
.clip.missing .play { cursor: default; }

/* 条件ごとに評価 */
.rate { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 24px; align-items: start; }
.cond-list { display: grid; gap: 2px; }
.cond-list button { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border: 0; border-radius: var(--radius); background: none; text-align: left; min-width: 0; }
.cond-list button span.name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cond-list button[aria-current="true"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.cond-list .done { font-family: var(--font-mono); font-size: .72rem; color: var(--accent); }
.panel { display: grid; gap: 18px; min-width: 0; }
.panel-head { display: grid; gap: 4px; }
.panel-head .stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .82rem; color: var(--muted); }
.form { display: grid; gap: 14px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.scale { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 4px 12px; align-items: center; }
.scale .hint { grid-column: 2; font-size: .75rem; color: var(--muted); }
.steps { display: flex; gap: 4px; flex-wrap: wrap; }
.steps button { width: 2.4rem; height: 2.2rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); font-family: var(--font-mono); }
.steps button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.field { display: grid; gap: 4px; }
.field label { font-weight: 500; font-size: .9rem; }
textarea { width: 100%; box-sizing: border-box; min-height: 4.5rem; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); resize: vertical; }
.save-state { font-size: .8rem; color: var(--muted); min-height: 1.2em; }
.list { display: grid; border-top: 1px solid var(--line); }
.list-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding-block: 8px; border-bottom: 1px solid var(--line); }
.list-row .clip { min-width: 9rem; }
.list-row .t { min-width: 0; font-size: .9rem; }
.list-row .t .mono { font-size: .75rem; color: var(--muted); margin-right: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 6px 12px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }

/* 評価のまとめ */
.summary { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .85rem; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: .78rem; white-space: nowrap; }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: center; }
td.memo { min-width: 14rem; max-width: 32rem; white-space: pre-wrap; }

.empty { padding: 32px 20px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); display: grid; gap: 6px; }
.empty strong { color: var(--ink); }
.banner { font-size: .82rem; color: var(--muted); }

@media (max-width: 760px) {
  .row { grid-template-columns: minmax(0, 1fr); }
  .rate { grid-template-columns: minmax(0, 1fr); }
  .cond-list { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; padding-bottom: 4px; }
  .scale { grid-template-columns: minmax(0, 1fr); }
  .scale .hint { grid-column: 1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="ident">
      <span class="eyebrow">音声生成の聞き比べ</span>
      <h1 id="exp-title">音声試聴ルーム</h1>
    </div>
    <div class="exp-pick">
      <label class="eyebrow" for="exp-select">実験</label>
      <select id="exp-select" disabled><option>読み込み中…</option></select>
    </div>
  </header>
  <p class="desc" id="exp-desc" hidden></p>
  <p class="banner" id="banner" hidden></p>

  <div id="main">
    <div class="empty" id="empty">
      <strong>実験を読み込んでいます</strong>
      <span>生成した音声のフォルダを Claude に渡すと、実験ごとにここへ並びます。同じ文を条件ごとに横に並べて聞き比べ、条件ごとに評価を残せます。</span>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
    return el;
  };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const SCALES = [
    { key: "similarity", label: "本人らしさ", hint: "1：別人／3：似ている／5：本人と区別できない" },
    { key: "naturalness", label: "自然さ", hint: "1：機械的・崩れる／3：気になる所がある／5：自然" },
    { key: "emotion", label: "感情表現", hint: "1：指示どおりにならない／3：多少出る／5：指示どおり" },
  ];

  const S = {
    db: null, user: null, canWrite: true,
    experiments: [], expId: null, manifest: null,
    view: store.get("listen:view", "compare"),
    ratings: {}, picks: {}, unsub: [],
    rateCond: null, hidden: new Set(),
  };

  /* ---------- 再生 ---------- */
  const audio = new Audio();
  audio.preload = "auto";
  let playing = null;   // { btn, src }
  let queue = [];
  function stop() {
    audio.pause();
    if (playing) { playing.btn.classList.remove("playing"); playing.btn.style.setProperty("--p", "0%"); }
    playing = null;
  }
  function play(btn, src) {
    const same = playing && playing.btn === btn;
    stop();
    if (same) { queue = []; return; }
    playing = { btn, src };
    btn.classList.add("playing");
    audio.src = src;
    audio.currentTime = 0;
    audio.play().catch(() => stop());
  }
  function playSeq(btns) {
    queue = btns.slice(1);
    if (btns.length) { stop(); playing = null; play(btns[0], btns[0].dataset.src); }
  }
  audio.addEventListener("timeupdate", () => {
    if (playing && audio.duration) playing.btn.style.setProperty("--p", (100 * audio.currentTime / audio.duration).toFixed(1) + "%");
  });
  audio.addEventListener("ended", () => {
    stop();
    const next = queue.shift();
    if (next) play(next, next.dataset.src);
  });

  /* ---------- データ ---------- */
  const conds = () => S.manifest ? S.manifest.conditions : [];
  const letterOf = (c) => LETTERS[conds().indexOf(c)] || "?";
  const clipOf = (c, key) => S.manifest.clips[c.id + "/" + key];
  const fmtSec = (s) => s == null ? "" : s.toFixed(1) + "s";

  async function loadManifest(id) {
    S.unsub.forEach((u) => u()); S.unsub = [];
    S.ratings = {}; S.picks = {}; S.manifest = null;
    stop(); queue = [];
    render();
    try {
      const r = await fetch("data/" + encodeURIComponent(id) + "/manifest.json");
      if (!r.ok) throw new Error(r.status);
      const m = await r.json();
      if (S.expId !== id) return;
      S.manifest = m;
    } catch {
      if (S.expId !== id) return;
      S.manifest = null;
      setEmpty("この実験の音声が見つかりません", "実験「" + id + "」のデータがページに公開されていません。Claude に公開し直すよう頼んでください。");
      return;
    }
    S.hidden = new Set(store.get("listen:hidden:" + id, []));
    if (!S.rateCond || !conds().some((c) => c.id === S.rateCond)) S.rateCond = conds()[0]?.id;
    if (S.db) {
      const base = S.db.doc("experiments/" + id);
      S.unsub.push(base.collection("ratings").onSnapshot((snap) => {
        S.ratings = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()]));
        renderLive();
      }, () => {}));
      S.unsub.push(base.collection("picks").onSnapshot((snap) => {
        S.picks = Object.fromEntries(snap.docs.map((d) => [d.id, d.data().cond]));
        renderLive();
      }, () => {}));
    }
    render();
  }

  function selectExp(id) {
    if (!id || id === S.expId) return;
    S.expId = id;
    store.set("listen:exp", id);
    if (/^[A-Za-z0-9-]+$/.test(id) && location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
    loadManifest(id);
  }

  /* 書き込みは文書ごとに1つずつ */
  const chains = {};
  function write(path, fn) {
    if (!S.db || !S.canWrite) return Promise.resolve();
    const run = (chains[path] || Promise.resolve()).then(fn).catch((e) => {
      if (e && e.code === "invalid_argument") { S.canWrite = false; render(); }
      throw e;
    });
    chains[path] = run.catch(() => {});
    return run;
  }

  /* ---------- 表示 ---------- */
  function setEmpty(title, text) {
    $("#main").replaceChildren(h("div", { class: "empty" }, h("strong", {}, title), h("span", {}, text)));
  }

  function renderHeader() {
    const sel = $("#exp-select");
    const list = S.experiments.slice();
    if (S.expId && !list.some((e) => e.id === S.expId)) list.unshift({ id: S.expId, title: S.manifest?.title || S.expId });
    sel.replaceChildren(...(list.length ? list.map((e) => h("option", { value: e.id, selected: e.id === S.expId }, e.title || e.id)) : [h("option", {}, "実験がありません")]));
    sel.disabled = !list.length;
    $("#exp-title").textContent = S.manifest?.title || "音声試聴ルーム";
    const d = $("#exp-desc");
    d.textContent = S.manifest?.description || "";
    d.hidden = !d.textContent;
    const b = $("#banner");
    b.textContent = !S.db ? "評価の保存はこの表示では使えません（サインインした状態で開くと保存できます）。"
      : !S.canWrite ? "閲覧のみの権限のため、評価は保存されません。" : "";
    b.hidden = !b.textContent;
  }

  function clipEl(c, item, { withPick = true, showLabel = true } = {}) {
    const clip = clipOf(c, item.key);
    if (!clip) return h("div", { class: "clip missing" }, h("span", { class: "play" }, h("span", { class: "letter" }, letterOf(c)), h("span", { class: "name muted" }, "なし")));
    const bad = clip.status && clip.status !== "ok";
    const btn = h("button", {
      class: "play" + (bad ? " bad" : ""), "data-src": clip.src,
      title: c.label + "　" + item.key + (clip.rtf != null ? "　RTF " + clip.rtf : "") + (bad ? "　" + clip.status : ""),
      onclick: (e) => play(e.currentTarget, clip.src),
    }, h("span", { class: "letter" }, letterOf(c)), showLabel ? h("span", { class: "name" }, c.label) : h("span", { class: "name" }), h("span", { class: "dur" }, bad ? clip.status : fmtSec(clip.seconds)));
    if (playing && playing.src === clip.src) { playing.btn = btn; btn.classList.add("playing"); }
    const picked = S.picks[item.key] === c.id;
    const el = h("div", { class: "clip" + (picked ? " picked" : "") }, btn);
    if (withPick && S.db) {
      el.append(h("button", {
        class: "pick", "aria-pressed": String(picked), title: picked ? "ベストから外す" : "この文のベストにする",
        "aria-label": c.label + "をこの文のベストにする", disabled: !S.canWrite,
        onclick: () => {
          const path = "experiments/" + S.expId + "/picks/" + item.key;
          const ref = S.db.doc(path);
          if (picked) { delete S.picks[item.key]; write(path, () => ref.delete()); }
          else { S.picks[item.key] = c.id; write(path, () => ref.set({ cond: c.id, at: new Date().toISOString() })); }
          renderLive();
        },
      }, picked ? "★" : "☆"));
    }
    return el;
  }

  function renderCompare() {
    const visible = conds().filter((c) => !S.hidden.has(c.id));
    const legend = h("div", { class: "legend", role: "group", "aria-label": "表示する条件" },
      conds().map((c) => h("button", {
        class: "chip", "aria-pressed": String(!S.hidden.has(c.id)), title: c.note || c.path,
        onclick: () => {
          S.hidden.has(c.id) ? S.hidden.delete(c.id) : S.hidden.add(c.id);
          store.set("listen:hidden:" + S.expId, [...S.hidden]);
          render();
        },
      }, h("span", { class: "letter" }, letterOf(c)), c.label)));
    const notes = conds().filter((c) => c.note).map((c) => h("div", {}, h("b", { class: "mono" }, letterOf(c)), "　" + c.label + "：" + c.note));
    const rows = h("div", { class: "rows" }, S.manifest.items.map((item) => {
      const clips = visible.map((c) => clipEl(c, item));
      return h("div", { class: "row" },
        h("div", { class: "sent" },
          h("div", { class: "key" }, h("span", { class: "mono" }, item.key)),
          item.text ? h("div", { class: "text" }, item.text) : h("div", { class: "text muted" }, item.tag),
          item.caption ? h("div", { class: "cap" }, "指示：" + item.caption) : null,
          h("button", { class: "row-act", onclick: () => playSeq(clips.map((el) => el.querySelector("button.play")).filter(Boolean)) }, "▶ 表示中の条件を順に再生")),
        h("div", { class: "clips" }, clips));
    }));
    return [h("div", { style: "display:grid;gap:8px" }, legend, notes.length ? h("div", { class: "legend-note" }, notes) : null,
      S.db ? h("div", { class: "legend-note" }, "☆ を押すと、その文でいちばん良かった条件として記録します。") : null), rows];
  }

  function avg(list) { const v = list.filter((x) => typeof x === "number"); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }

  function renderSummary() {
    const pickCount = (c) => Object.values(S.picks).filter((p) => p === c.id).length;
    return h("div", { class: "summary" }, h("table", {},
      h("thead", {}, h("tr", {}, h("th", {}, "条件"), SCALES.map((s) => h("th", {}, s.label)), h("th", {}, "ベスト"), h("th", {}, "平均RTF"), h("th", {}, "読み間違い・メモ"))),
      h("tbody", {}, conds().map((c) => {
        const r = S.ratings[c.id] || {};
        const rtf = avg(S.manifest.items.map((i) => clipOf(c, i.key)?.rtf));
        return h("tr", {},
          h("td", {}, h("span", { class: "mono" }, letterOf(c) + " "), c.label),
          SCALES.map((s) => h("td", { class: "num" }, r[s.key] ?? "–")),
          h("td", { class: "num" }, String(pickCount(c))),
          h("td", { class: "num" }, rtf == null ? "–" : rtf.toFixed(3)),
          h("td", { class: "memo" }, [r.misreads, r.memo].filter(Boolean).join("\n") || ""));
      }))));
  }

  const drafts = {};
  function renderRate() {
    const c = conds().find((x) => x.id === S.rateCond) || conds()[0];
    const r = S.ratings[c.id] || {};
    const path = "experiments/" + S.expId + "/ratings/" + c.id;
    const ref = S.db ? S.db.doc(path) : null;
    const state = h("div", { class: "save-state", id: "save-state" }, r.updatedAt ? "保存済み " + new Date(r.updatedAt).toLocaleString("ja-JP") : "まだ評価していません");
    const save = (patch) => {
      S.ratings[c.id] = { ...(S.ratings[c.id] || {}), ...patch, updatedAt: new Date().toISOString() };
      state.textContent = "保存中…";
      write(path, () => ref.set({ ...S.ratings[c.id] })).then(() => { state.textContent = "保存しました"; }, () => { state.textContent = "保存できませんでした"; });
    };
    const disabled = !S.db || !S.canWrite;
    const scales = SCALES.map((s) => h("div", { class: "scale" },
      h("span", { id: "lbl-" + s.key, style: "font-weight:500;font-size:.9rem" }, s.label),
      h("div", { class: "steps", role: "group", "aria-labelledby": "lbl-" + s.key }, [1, 2, 3, 4, 5].map((n) => h("button", {
        "aria-pressed": String(r[s.key] === n), disabled,
        onclick: () => { save({ [s.key]: r[s.key] === n ? null : n }); renderLive(); },
      }, String(n)))),
      h("span", { class: "hint" }, s.hint)));
    const text = (key, label, ph) => {
      const id = "f-" + key;
      const ta = h("textarea", { id, placeholder: ph, disabled });
      ta.value = drafts[c.id + key] ?? r[key] ?? "";
      let t;
      ta.addEventListener("input", () => { drafts[c.id + key] = ta.value; clearTimeout(t); t = setTimeout(() => commit(), 900); });
      const commit = () => { clearTimeout(t); const v = ta.value.trim(); delete drafts[c.id + key]; if (v !== ((S.ratings[c.id] || {})[key] || "")) save({ [key]: v }); };
      ta.addEventListener("blur", commit);
      return h("div", { class: "field" }, h("label", { for: id }, label), ta);
    };
    const btns = [];
    const list = h("div", { class: "list" }, S.manifest.items.map((item) => {
      const el = clipEl(c, item, { showLabel: false });
      const b = el.querySelector("button.play"); if (b) btns.push(b);
      return h("div", { class: "list-row" },
        h("div", { class: "t" }, h("span", { class: "mono" }, item.key), item.text || item.tag, S.picks[item.key] === c.id ? h("span", { style: "color:var(--star)" }, " ★") : null),
        el);
    }));
    const clips = S.manifest.items.map((i) => clipOf(c, i.key)).filter(Boolean);
    const rtf = avg(clips.map((x) => x.rtf));
    const fails = clips.filter((x) => x.status && x.status !== "ok").length;
    const condList = h("nav", { class: "cond-list", "aria-label": "条件" }, conds().map((x) => {
      const rr = S.ratings[x.id];
      const done = rr && SCALES.every((s) => typeof rr[s.key] === "number");
      return h("button", { "aria-current": String(x.id === c.id), onclick: () => { S.rateCond = x.id; stop(); render(); } },
        h("span", { class: "letter" }, letterOf(x)), h("span", { class: "name" }, x.label), done ? h("span", { class: "done" }, "済") : null);
    }));
    return [renderSummary(), h("div", { class: "rate" }, condList,
      h("div", { class: "panel" },
        h("div", { class: "panel-head" },
          h("h2", {}, letterOf(c) + "　" + c.label),
          c.note ? h("div", { class: "muted" }, c.note) : null,
          h("div", { class: "stats mono" }, h("span", {}, clips.length + " 本"), rtf != null ? h("span", {}, "平均RTF " + rtf.toFixed(3)) : null, fails ? h("span", { style: "color:var(--warn)" }, "失敗 " + fails) : null, h("span", {}, c.path))),
        h("div", { style: "display:flex;gap:8px;flex-wrap:wrap" }, h("button", { class: "btn primary", onclick: () => playSeq(btns) }, "▶ 全部続けて再生"), h("button", { class: "btn", onclick: () => { queue = []; stop(); } }, "停止")),
        list,
        h("div", { class: "form" },
          h("h2", {}, "この条件の評価"),
          scales,
          text("misreads", "読み間違い", "例：09_long「生憎」を「なまにく」と読む"),
          text("memo", "メモ", "気づいたこと、次に試すこと"),
          state)))];
  }

  function renderMain() {
    if (!S.manifest) return;
    const tabs = h("div", { class: "tabs", role: "tablist" },
      [["compare", "文ごとに聞き比べ"], ["rate", "条件ごとに評価"]].map(([v, label]) => h("button", {
        role: "tab", "aria-selected": String(S.view === v),
        onclick: () => { S.view = v; store.set("listen:view", v); stop(); render(); },
      }, label)));
    $("#main").replaceChildren(h("div", { style: "display:grid;gap:18px" }, tabs, ...(S.view === "rate" ? renderRate() : renderCompare())));
  }

  function render() { renderHeader(); renderMain(); }
  /* データベースの更新では、入力中の欄を壊さないよう評価フォームの文字欄はそのまま */
  function renderLive() {
    const a = document.activeElement;
    if (a && a.tagName === "TEXTAREA") {
      const id = a.id, pos = a.selectionStart;
      render();
      const el = document.getElementById(id);
      if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
    } else render();
  }

  $("#exp-select").addEventListener("change", (e) => selectExp(e.target.value));
  window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id) selectExp(id); });

  const initial = location.hash.slice(1) || store.get("listen:exp", null);
  if (initial) selectExp(initial);

  (async () => {
    const use = (n) => window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
    const [db, user] = await Promise.all([use("db"), use("user")]);
    S.db = db || null;
    S.user = user || null;
    if (user) { try { const c = await user.can("data.write"); if (c === false) S.canWrite = false; } catch {} }
    if (!S.db) {
      render();
      if (!S.expId) setEmpty("実験の一覧を読み込めません", "サインインした状態で開いてください。実験のアドレス（末尾が #実験ID）を開くと、評価なしで聞けます。");
      return;
    }
    S.db.collection("experiments").onSnapshot((snap) => {
      S.experiments = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
        .sort((a, b) => String(b.created || "").localeCompare(String(a.created || "")) || a.id.localeCompare(b.id));
      if (!S.expId && S.experiments.length) selectExp(S.experiments[0].id);
      else if (!S.experiments.length && !S.expId) setEmpty("まだ実験がありません", "生成した音声のフォルダを Claude に渡して「試聴ページに追加して」と頼むと、ここに並びます。");
      renderLive();
    }, () => {});
    if (S.expId) loadManifest(S.expId);
  })();
})();
</script>
